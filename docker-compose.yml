# ════════════════════════════════════════════════════════════════════
#  Leave Management System — docker-compose
#  Spring Boot | Kafka | Resilience4j | ELK Stack | Zipkin
# ════════════════════════════════════════════════════════════════════

services:

  # ── ELK STACK ──────────────────────────────────────────────────────

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: elasticsearch
    hostname: elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - lms-network

  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.0
    container_name: logstash
    hostname: logstash
    restart: unless-stopped
    ports:
      - "5044:5044"
      - "9600:9600"
    volumes:
      - ./elk/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./elk/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9600/_node/stats"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - lms-network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.0
    container_name: kibana
    hostname: kibana
    restart: unless-stopped
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - xpack.security.enabled=false
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5601/api/status"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s   # Kibana is slow to boot
    networks:
      - lms-network

  # ── KAFKA (KRaft mode — no Zookeeper) ──────────────────────────────

  kafka:
    image: apache/kafka:4.3.0
    container_name: kafka
    hostname: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_NUM_PARTITIONS=1
      - KAFKA_LOG_RETENTION_HOURS=24
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "./opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 15s
    networks:
      - lms-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=lms-cluster
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/clusters"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - lms-network

  # ── DISTRIBUTED TRACING ─────────────────────────────────────────────

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zipkin
    hostname: zipkin
    restart: unless-stopped
    ports:
      - "9411:9411"
    environment:
      - STORAGE_TYPE=mem
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9411/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - lms-network

  # ── DATABASES ───────────────────────────────────────────────────────

  h2-auth:
    container_name: h2-auth
    image: oscarfonts/h2
    restart: unless-stopped
    ports:
      - "1521:1521"
      - "8281:81"
    volumes:
      - h2-data-1:/opt/h2-data
    environment:
      H2_OPTIONS: -ifNotExists
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/1521'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - lms-network

  auth-db-init:
    image: oscarfonts/h2
    container_name: auth-db-init
    depends_on:
      h2-auth:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts
    entrypoint:
      - sh
      - -c
      - |
        echo 'Running auth-data.sql...' &&
        java -cp /opt/h2/bin/h2*.jar org.h2.tools.RunScript \
          -url 'jdbc:h2:tcp://h2-auth:1521/authdb' \
          -user sa -password 'password' \
          -script /scripts/auth-data.sql &&
        echo 'Database initialization complete!'
    restart: "no"
    networks:
      - lms-network

  h2-emp:
    container_name: h2-emp
    image: oscarfonts/h2
    restart: unless-stopped
    ports:
      - "1522:1521"
      - "8282:81"
    volumes:
      - h2-data-2:/opt/h2-data
    environment:
      H2_OPTIONS: -ifNotExists
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/1521'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - lms-network

  emp-db-init:
    image: oscarfonts/h2
    container_name: emp-db-init
    depends_on:
      h2-emp:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts
    entrypoint:
      - sh
      - -c
      - |
        echo 'Running emp-data.sql...' &&
        java -cp /opt/h2/bin/h2*.jar org.h2.tools.RunScript \
          -url 'jdbc:h2:tcp://h2-emp:1521/empdb' \
          -user sa -password 'password' \
          -script /scripts/emp-data.sql &&
        echo 'Database initialization complete!'
    restart: "no"
    networks:
      - lms-network

  h2-leave:
    container_name: h2-leave
    image: oscarfonts/h2
    restart: unless-stopped
    ports:
      - "1523:1521"
      - "8283:81"
    volumes:
      - h2-data-3:/opt/h2-data
    environment:
      H2_OPTIONS: -ifNotExists
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/1521'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - lms-network

  leave-db-init:
    image: oscarfonts/h2
    container_name: leave-db-init
    depends_on:
      h2-leave:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts
    entrypoint:
      - sh
      - -c
      - |
        echo 'Running leave-data.sql...' &&
        java -cp /opt/h2/bin/h2*.jar org.h2.tools.RunScript \
          -url 'jdbc:h2:tcp://h2-leave:1521/leavedb' \
          -user sa -password 'password' \
          -script /scripts/leave-data.sql &&
        echo 'Database initialization complete!'
    restart: "no"
    networks:
      - lms-network

  # ── SERVICE DISCOVERY ───────────────────────────────────────────────

  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    hostname: eureka-server
    restart: unless-stopped
    ports:
      - "8761:8761"
    environment:
      SPRING_APPLICATION_NAME: eureka-server
      SPRING_PROFILES_ACTIVE: docker
      LOGGING_LOGSTASH_HOST: logstash
      LOGGING_LOGSTASH_PORT: "5044"
    depends_on:
      logstash:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - lms-network

  # ── CORE MICROSERVICES ──────────────────────────────────────────────

  auth-service:
    build: ./auth-service
    hostname: auth-service
    restart: unless-stopped
    deploy:
      replicas: 2
    ports:
      - "8011-8020:8011"
    environment:
      SPRING_APPLICATION_NAME: auth-service
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      JWT_SECRET: lms-super-secret-key-must-be-at-least-256-bits-long-for-hs256
      LOGGING_LOGSTASH_HOST: logstash
      LOGGING_LOGSTASH_PORT: "5044"
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      SPRING_DATASOURCE_URL: jdbc:h2:tcp://h2-auth:1521/authdb
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_SQL_INIT_MODE: never
    depends_on:
      auth-db-init:
        condition: service_completed_successfully
      eureka-server:
        condition: service_healthy
      zipkin:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - lms-network

  employee-service:
    build: ./employee-service
    hostname: employee-service
    restart: unless-stopped
    deploy:
      replicas: 3
    ports:
      - "8021-8030:8021"
    environment:
      SPRING_APPLICATION_NAME: employee-service
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      LOGGING_LOGSTASH_HOST: logstash
      LOGGING_LOGSTASH_PORT: "5044"
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      SPRING_DATASOURCE_URL: jdbc:h2:tcp://h2-emp:1521/empdb
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_SQL_INIT_MODE: never
    depends_on:
      emp-db-init:
        condition: service_completed_successfully
      eureka-server:
        condition: service_healthy
      zipkin:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - lms-network

  leave-service:
    build: ./leave-service
    hostname: leave-service
    restart: unless-stopped
    deploy:
      replicas: 3
    ports:
      - "8031-8040:8031"
    environment:
      SPRING_APPLICATION_NAME: leave-service
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      LOGGING_LOGSTASH_HOST: logstash
      LOGGING_LOGSTASH_PORT: "5044"
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      SPRING_DATASOURCE_URL: jdbc:h2:tcp://h2-leave:1521/leavedb
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_SQL_INIT_MODE: never
    depends_on:
      leave-db-init:
        condition: service_completed_successfully
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      employee-service:
        condition: service_healthy
      zipkin:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - lms-network

  notification-service:
    build: ./notification-service
    container_name: notification-service
    hostname: notification-service
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      SPRING_APPLICATION_NAME: notification-service
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: notification-service
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      LOGGING_LOGSTASH_HOST: logstash
      LOGGING_LOGSTASH_PORT: "5044"
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
    depends_on:
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      logstash:
        condition: service_healthy
      zipkin:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - lms-network

  # ── API GATEWAY — starts last ───────────────────────────────────────

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    hostname: api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: api-gateway
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      JWT_SECRET: lms-super-secret-key-must-be-at-least-256-bits-long-for-hs256
      LOGGING_LOGSTASH_HOST: logstash
      LOGGING_LOGSTASH_PORT: "5044"
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
    depends_on:
      eureka-server:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      employee-service:
        condition: service_healthy
      leave-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      logstash:
        condition: service_healthy
      zipkin:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - lms-network

volumes:
  elasticsearch_data:
    driver: local
  kafka_data:
    driver: local
  h2-data-1:
  h2-data-2:
  h2-data-3:

networks:
  lms-network:
    driver: bridge