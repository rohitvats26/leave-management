input {
  # Direct TCP from LogstashTcpSocketAppender in each Spring Boot service.
  # json_lines codec: each line is a complete JSON object from LogstashEncoder.
  tcp {
    port  => 5044
    codec => json_lines
  }
}

filter {
  # ── Timestamp ──────────────────────────────────────────────────────
  if [@timestamp] {
    date {
      match  => ["@timestamp", "ISO8601"]
      target => "@timestamp"
    }
  }

  # ── Normalise field names ──────────────────────────────────────────
  # LogstashEncoder writes: service, level, message, logger, thread
  # Promote them to top level if nested under a wrapper key
  if ![service] and [log][service] {
    mutate { copy => { "[log][service]" => "service" } }
  }
  if ![level] and [log][level] {
    mutate { copy => { "[log][level]" => "level" } }
  }

  # Fallback service name if still missing
  if ![service] or [service] == "" {
    mutate { add_field => { "service" => "unknown" } }
  }

  # ── Index name — computed AFTER service field is available ─────────
  # FIX: was computed before JSON parse, so service was always empty
  mutate {
    add_field => {
      "[@metadata][index]" => "lms-%{service}-%{+YYYY.MM.dd}"
    }
  }

  # ── Semantic tags for Kibana filtering ────────────────────────────
  if [message] =~ /CIRCUIT.BREAKER|CircuitBreaker|circuit_breaker/ {
    mutate { add_tag => ["circuit_breaker_event"] }
  }
  if [message] =~ /\[KAFKA\]/ {
    mutate { add_tag => ["kafka_event"] }
  }
  if [level] == "ERROR" {
    mutate { add_tag => ["error"] }
  }
  if [message] =~ /\d+ms/ {
    grok {
      match      => { "message" => "(?<resp_ms>\d+)ms" }
      tag_on_failure => []
    }
    if [resp_ms] {
      mutate { convert => { "[resp_ms]" => "integer" } }
      if [resp_ms] > 2000 {
        mutate { add_tag => ["slow_response"] }
      }
    }
  }
}

output {
  elasticsearch {
    hosts  => ["elasticsearch:9200"]
    index  => "%{[@metadata][index]}"
    action => "index"
  }
}
