input {
  # Receive JSON logs from all Spring Boot services via TCP
  tcp {
    port => 5044
    codec => json_lines
  }
}

filter {
  # Parse the @timestamp sent by logstash-logback-encoder
  if [type] == "json" or [@timestamp] {
    date {
      match => ["@timestamp", "ISO8601"]
      target => "@timestamp"
    }
  }

  # Enrich with service metadata
  mutate {
    add_field => {
      "[@metadata][index]" => "lms-%{service}-%{+YYYY.MM.dd}"
    }
  }

  # Tag slow responses (> 2000ms) parsed from gateway log messages
  if [message] =~ /\| \d+ms/ {
    grok {
      match => { "message" => "%{INT:response_time_ms}ms" }
      tag_on_failure => []
    }
    if [response_time_ms] and [response_time_ms] > 2000 {
      mutate { add_tag => ["slow_response"] }
    }
  }

  # Tag circuit breaker events
  if [message] =~ /CIRCUIT-BREAKER|CircuitBreaker/ {
    mutate { add_tag => ["circuit_breaker_event"] }
  }

  # Tag Kafka consumer events
  if [message] =~ /\[KAFKA\]/ {
    mutate { add_tag => ["kafka_event"] }
  }
}

output {
  elasticsearch {
    hosts           => ["elasticsearch:9200"]
    index           => "%{[@metadata][index]}"
    action          => "index"
    document_type   => "_doc"
  }

  # Uncomment for debugging:
  # stdout { codec => rubydebug }
}
